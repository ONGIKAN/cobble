[package]
name = "cobble-studio"
version = "0.12.0"
description = "Cobble Studio — lightweight block-based 2D game maker"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
